# Local stand-in for Supabase's API gateway: Supabase clients call <url>/auth/v1/...,
# while the auth server itself serves from the root.
# Docker's DNS is asked on every request (variables + resolver), so a restarted auth
# container with a new IP is still found.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 54321;
  location /auth/v1/ {
    set $upstream http://auth:9999;
    rewrite ^/auth/v1/(.*)$ /$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}
server {
  listen 54331;
  location /auth/v1/ {
    set $upstream http://auth-test:9999;
    rewrite ^/auth/v1/(.*)$ /$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}
