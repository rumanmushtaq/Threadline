# Local Postgres + Supabase Auth for development and tests.
# Production uses a Supabase project (see README).
x-auth: &auth
  image: supabase/auth:v2.180.0
  depends_on: [postgres]
  restart: unless-stopped
  environment: &auth-env
    GOTRUE_API_HOST: 0.0.0.0
    PORT: "9999"
    GOTRUE_DB_DRIVER: postgres
    DB_NAMESPACE: auth
    # Same secret the Supabase CLI uses locally. Never use it for a real project.
    GOTRUE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
    GOTRUE_JWT_EXP: "3600"
    GOTRUE_JWT_AUD: authenticated
    GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
    GOTRUE_JWT_ADMIN_ROLES: service_role
    # Shoppers sign up themselves (team accounts are still made by the admin only).
    GOTRUE_DISABLE_SIGNUP: "false"
    GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
    GOTRUE_MAILER_AUTOCONFIRM: "false"
    GOTRUE_SMTP_HOST: mailpit
    GOTRUE_SMTP_PORT: "1025"
    GOTRUE_SMTP_ADMIN_EMAIL: no-reply@threadline.test
    GOTRUE_SMTP_SENDER_NAME: Threadline
    GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
    GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
    # "Continue with Google" with placeholder credentials: the flow can start (and is tested
    # up to Google's page), but a real Google sign-in needs your own client in Supabase.
    GOTRUE_EXTERNAL_GOOGLE_ENABLED: "true"
    GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: local-placeholder.apps.googleusercontent.com
    GOTRUE_EXTERNAL_GOOGLE_SECRET: local-placeholder
    GOTRUE_RATE_LIMIT_EMAIL_SENT: "1000"
    GOTRUE_RATE_LIMIT_TOKEN_REFRESH: "100000"
    GOTRUE_RATE_LIMIT_VERIFY: "100000"
    GOTRUE_RATE_LIMIT_OTP: "100000"

services:
  postgres:
    image: postgres:17-alpine
    container_name: threadline-postgres
    environment:
      POSTGRES_USER: threadline
      POSTGRES_PASSWORD: threadline
      POSTGRES_DB: threadline
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - threadline-pg:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    restart: unless-stopped

  # Supabase Auth for `pnpm dev` (database "threadline").
  auth:
    <<: *auth
    container_name: threadline-auth
    environment:
      <<: *auth-env
      DATABASE_URL: postgres://threadline:threadline@postgres:5432/threadline?search_path=auth
      API_EXTERNAL_URL: http://127.0.0.1:54321/auth/v1
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: http://127.0.0.1:54321/auth/v1/callback
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: http://localhost:3000/**,http://127.0.0.1:3000/**

  # Supabase Auth for unit and end-to-end tests (database "threadline_test").
  auth-test:
    <<: *auth
    container_name: threadline-auth-test
    environment:
      <<: *auth-env
      DATABASE_URL: postgres://threadline:threadline@postgres:5432/threadline_test?search_path=auth
      API_EXTERNAL_URL: http://127.0.0.1:54331/auth/v1
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: http://127.0.0.1:54331/auth/v1/callback
      GOTRUE_SITE_URL: http://localhost:3300
      GOTRUE_URI_ALLOW_LIST: http://localhost:3300/**,http://127.0.0.1:3300/**

  # Plays the part of Supabase's API gateway (http://127.0.0.1:54321 dev, :54331 tests).
  supabase-gateway:
    image: nginx:1.27-alpine
    container_name: threadline-supabase-gateway
    depends_on: [auth, auth-test]
    ports:
      - "127.0.0.1:54321:54321"
      - "127.0.0.1:54331:54331"
    volumes:
      - ./docker/supabase-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # Catches password-reset emails: http://127.0.0.1:54324
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: threadline-mailpit
    ports:
      - "127.0.0.1:54324:8025"
    restart: unless-stopped

volumes:
  threadline-pg:
